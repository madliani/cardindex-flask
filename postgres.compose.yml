name: cardindex-flask

networks:
  postgres:
    driver: bridge

services:
  adminer:
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - path: .env
        required: true
    image: adminer:5.5.0
    networks:
      - postgres
    ports:
      - ${ADMINER_PORT:-8080}:8080
    resources:
      limits:
        cpus: 1.0
        memory: 1G
      reservations:
        cpus: 0.5
        memory: 500M
    restart: unless-stopped
    stdin_open: false
    tty: false

  postgres:
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:18.4
    networks:
      - postgres
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    resources:
      limits:
        cpus: 1.0
        memory: 1G
      reservations:
        cpus: 0.5
        memory: 500M
    restart: unless-stopped
    stdin_open: false
    tty: false
