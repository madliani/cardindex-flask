name: cardindex-flask

services:
  adminer:
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - path: .env
        required: true
    image: adminer:5.5.0
    ports:
      - ${ADMINER_PORT:-8080}:8080
    restart: always
    tty: false

  postgres:
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:18.4
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/docker
    tty: false

volumes:
  postgres_data:
